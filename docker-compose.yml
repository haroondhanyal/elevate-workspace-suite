services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elevate_erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    ports:
      - "5432:5432"
    volumes:
      - erp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d elevate_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://erp:erp@db:5432/elevate_erp
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - ./backend/custom_addons:/mnt/extra-addons
      - ./backend/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo_data:/var/lib/odoo

volumes:
  erp_postgres:
  odoo_data:
