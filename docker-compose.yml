services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elevate_erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp}
    ports:
      - "5432:5432"
    volumes:
      - erp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d elevate_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-erp}@db:5432/${POSTGRES_DB:-elevate_erp}}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SECRET_KEY: ${SECRET_KEY:-change-this-development-secret-before-production}
      APP_ENV: ${APP_ENV:-development}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  odoo:
    image: odoo:19.0
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-erp}
      PASSWORD: ${POSTGRES_PASSWORD:-erp}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - ./backend/custom_addons:/mnt/extra-addons
      - ./backend/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo_data:/var/lib/odoo

volumes:
  erp_postgres:
  odoo_data:
  api_uploads:
